<!DOCTYPE html>

<header class="shadow p-6 flex flex-col items-center" style="background-color: #FCFCF7; color: #072B3C;">

    </a>
  </div>
  <nav class="space-x-6 text-sm font-medium flex flex-wrap justify-center">
    <a href="index.html#sobre">Sobre</a>
    <a href="index.html#servicos">Serviços</a>
    <a href="index.html#portfolio">Portfólio</a>

<section class="py-20 px-6 text-center" style="background-color: var(--azul-escuro); color: var(--branco-quase);">

<main>

<script>

      categoria: 'Política Pública',

      link: 'https://oimparcial.com.br/colunas/wagner-jales-mestre-em-arquitetura-e-urbanismo/um-plebiscito-sobre-passe-livre-estudantil/'

    {
      categoria: 'Arquitetura',
      titulo: 'Por que Arquitetos Precisam Considerar a Mobilidade Urbana em Seus Projetos',

    {

  ];

  const container = document.querySelector('#Blog .grid');

  artigos.forEach(({ categoria, titulo, descricao, link }) => {
    container.innerHTML += `
    <article class="bg-white rounded shadow p-4 flex flex-col">
      <img src="https://via.placeholder.com/300x200.png?text=Artigo" alt="${titulo}" class="mb-2">
      <h3 class="text-sm text-gray-600 uppercase mb-1">${categoria}</h3>
      <h4 class="text-lg font-semibold mb-2">${titulo}</h4>
      <p class="text-sm text-gray-500 mb-2">${descricao}</p>
      <a href="${link}" target="_blank" class="text-blue-700 underline text-sm">Ler artigo</a>
    </article>`;
  });
</script>

</body>
</html>
